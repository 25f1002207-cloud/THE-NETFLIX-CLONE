<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone Collaborative Project</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/hero.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" target="_self">
            <img class="nav-logo" src="Images/Netflix Logo.png">
        </a>
        <nav class="nav-main">
            <ul class="nav-conatainer">
                <li class="nav-links"><a href="#" class="active">Home</a></li>
                <li class="nav-links"><a href="#" class="active">Shows</a></li>
                <li class="nav-links"><a href="#" class="active">Movies</a></li>
                <li class="nav-links"><a href="#" class="active">Games</a></li>
                <li class="nav-links"><a href="#" class="active">New & Popular</a></li>
                <li class="nav-links"><a href="#" class="active">My List</a></li>
                <li class="nav-links"><a href="#" class="active">Browse by Languages</a></li>
            </ul>
        </nav>
        <div class="nav-secondary">
            <button class="nav-button"><img class="nav-search" src="Images/Search Icon.png"></button>
            <button class="nav-button"><img class="nav-bell" src="Images/Notification Bell.png"></button>
            <a class="kids_section" href="#"><img class="kids-section-logo" src="Images/Kid's Section Logo.png"><p class="children">Children</p></a>
            <div class="account-related">
                <button class="account-related-button">
                <img class="user-account-logo" src="Images/User Account Logo.jpg"> 
                <img class="down-arrow" src="Images/Down Arrow.png">
                </button>
                <div class="settings">
                    <ul>
                        <li><a href="#">Manage Profiles</a></li>
                        <li><a href="#">Account</a></li>
                        <li><a href="#">Help Center</a></li>
                        <li><hr></li>
                        <li><a href="#">Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>



    <section class="hero">
                
        <div class="slider">

            <input type="radio" name="slide" id="slide1" checked>
            <input type="radio" name="slide" id="slide2">
            <input type="radio" name="slide" id="slide3">
            <input type="radio" name="slide" id="slide4">
            <input type="radio" name="slide" id="slide5">

            <div class="slides">
                <div class="slide"><img src="Images/hero_1.jpg" alt="Show 1"></div>
                <div class="slide"><img src="Images/hero_2.jpg" alt="Show 2"></div>
                <div class="slide"><img src="Images/hero_3.jpg" alt="Show 3"></div>
                <div class="slide"><img src="Images/hero_4.jpg" alt="Show 4"></div>
                <div class="slide"><img src="Images/hero_5.jpg" alt="Show 5"></div>
            </div>

            <div class="navigation-dots">
                <label for="slide1" class="dot"></label>
                <label for="slide2" class="dot"></label>
                <label for="slide3" class="dot"></label>
                <label for="slide4" class="dot"></label>
                <label for="slide5" class="dot"></label>
            </div>
        
        </div>  

    </section>

</body>
</html>
