<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Unlimited movies, TV shows and more</title>
  <link rel="stylesheet" href="netflix-login.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="header">
    <a href="login.html" class="brand">
      <img src="logo.svg" alt="Netflix logo" class="logo-img">
    </a>
    <a href="login.html" class="sign-in-btn">Sign In</a>
  </header>

  <main class="hero">
    <div class="hero-copy">
      <h1>Unlimited movies, TV shows and more.</h1>
      <p>Watch anywhere. Cancel anytime.</p>
      <p class="cta-text">Ready to watch? Enter your email to create or restart your membership.</p>

      <form class="cta-form" action="#" method="get" autocomplete="on">
        <label for="email" class="sr-only">Email address</label>
        <input id="email" name="email" type="email" placeholder="Email address" required>
        <button type="submit"><a href="signup.html" class="sign-in-btn">Get Started</a></button>
      </form>
    </div>
  </main>
</body>
</html>
