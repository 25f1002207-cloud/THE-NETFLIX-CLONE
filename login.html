<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Sign In</title>
  <link rel="stylesheet" href="netflix-login.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="header">
    <a href="#" class="brand">
      <img src="logo.svg" alt="Netflix" class="logo-img">
    </a>
  </header>

  <main class="center">
    <section class="signin-card" aria-labelledby="signin-heading">
      <h1 id="signin-heading">Sign In</h1>

      <form action="#" method="post" autocomplete="on">
        <label for="email">Email or phone number</label>
        <input id="email" name="email" type="email" placeholder="Email or phone number" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" required>

        <button class="btn" type="submit">Sign In</button>

        <div class="options">
          <label class="remember">
            <input type="checkbox" name="remember"> Remember me
          </label>
          <a class="help" href="#">Need help?</a>
        </div>
      </form>

      <p class="signup">New to Netflix? <a href="signup.html">Sign up now</a>.</p>
      <p class="recaptcha">This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#">Learn more.</a></p>
    </section>
  </main>

</body>
</html>
